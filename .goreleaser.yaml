version: 2

project_name: kamino

builds:
  - id: kamino
    main: ./cmd/kamino
    binary: kamino
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Gunmer/kamino/internal/version.Version={{ .Version }}
      - -X github.com/Gunmer/kamino/internal/buildinfo.SelfContained=true

archives:
  - id: kamino
    formats:
      - binary
    name_template: kamino-arm64

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: false
  prerelease: auto

changelog:
  disable: true
