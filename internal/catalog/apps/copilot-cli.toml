id = "copilot-cli"
name = "Copilot CLI"
command = "copilot"
optional_paths = [".copilot/settings.json", ".copilot/instructions.md", ".copilot/agents", ".copilot/skills", ".copilot/mcp.json"]
exclude = ["**/config.json", "**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
cask = "copilot-cli"

[[install]]
method = "npm"
package = "@github/copilot"

[[install]]
method = "github-release"
repo = "github/copilot-cli"
asset = "copilot-darwin-arm64.tar.gz"
format = "tar.gz"
checksums = "SHA256SUMS.txt"
arch = "arm64"
extract = [
  { file = "copilot", dest = ".local/bin/copilot" },
]

[[install]]
method = "github-release"
repo = "github/copilot-cli"
asset = "copilot-darwin-x64.tar.gz"
format = "tar.gz"
checksums = "SHA256SUMS.txt"
arch = "amd64"
extract = [
  { file = "copilot", dest = ".local/bin/copilot" },
]
