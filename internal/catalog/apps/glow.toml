id = "glow"
name = "Glow"
command = "glow"
optional_paths = ["Library/Preferences/glow/glow.yml", "Library/Preferences/glow/glow.yaml", ".config/glow/glow.yml", ".config/glow/glow.yaml"]
exclude = ["**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
formula = "glow"

[[install]]
method = "github-release"
repo = "charmbracelet/glow"
asset = "glow_{version}_Darwin_arm64.tar.gz"
format = "tar.gz"
checksums = "checksums.txt"
arch = "arm64"
extract = [
  { file = "glow_{version}_Darwin_arm64/glow", dest = ".local/bin/glow" },
]

[[install]]
method = "github-release"
repo = "charmbracelet/glow"
asset = "glow_{version}_Darwin_x86_64.tar.gz"
format = "tar.gz"
checksums = "checksums.txt"
arch = "amd64"
extract = [
  { file = "glow_{version}_Darwin_x86_64/glow", dest = ".local/bin/glow" },
]
