id = "herdr"
name = "herdr"
command = "herdr"
paths = [".config/herdr/config.toml", ".config/herdr/plugins/config"]
env_paths = ["HERDR_CONFIG_PATH"]
xdg_paths = ["herdr/config.toml"]
exclude = ["**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
formula = "herdr"

[[install]]
method = "installer"
url = "https://herdr.dev/install.sh"

[[install]]
method = "github-release"
repo = "herdrdev/herdr"
asset = "herdr-macos-aarch64"
format = "raw"
dest = ".local/bin/herdr"
arch = "arm64"

[[install]]
method = "github-release"
repo = "herdrdev/herdr"
asset = "herdr-macos-x86_64"
format = "raw"
dest = ".local/bin/herdr"
arch = "amd64"
