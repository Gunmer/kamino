id = "github-cli"
name = "GitHub CLI"
command = "gh"
optional_paths = [".config/gh/config.yml"]
exclude = ["**/hosts.yml", "**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
formula = "gh"

[[install]]
method = "github-release"
repo = "cli/cli"
asset = "gh_{version}_macOS_arm64.zip"
format = "zip"
checksums = "gh_{version}_checksums.txt"
arch = "arm64"
extract = [
  { file = "gh_{version}_macOS_arm64/bin/gh", dest = ".local/bin/gh" },
]

[[install]]
method = "github-release"
repo = "cli/cli"
asset = "gh_{version}_macOS_amd64.zip"
format = "zip"
checksums = "gh_{version}_checksums.txt"
arch = "amd64"
extract = [
  { file = "gh_{version}_macOS_amd64/bin/gh", dest = ".local/bin/gh" },
]
