id = "bat"
name = "bat"
command = "bat"
optional_paths = [".config/bat/config", ".config/bat/themes"]
exclude = ["**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
formula = "bat"

[[install]]
method = "github-release"
repo = "sharkdp/bat"
asset = "bat-v{version}-aarch64-apple-darwin.tar.gz"
format = "tar.gz"
arch = "arm64"
extract = [
  { file = "bat-v{version}-aarch64-apple-darwin/bat", dest = ".local/bin/bat" },
]

[[install]]
method = "github-release"
repo = "sharkdp/bat"
asset = "bat-v{version}-x86_64-apple-darwin.tar.gz"
format = "tar.gz"
arch = "amd64"
extract = [
  { file = "bat-v{version}-x86_64-apple-darwin/bat", dest = ".local/bin/bat" },
]
