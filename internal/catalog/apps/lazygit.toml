id = "lazygit"
name = "LazyGit"
command = "lazygit"
optional_paths = ["Library/Application Support/lazygit/config.yml", ".config/lazygit/config.yml"]
exclude = ["**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
formula = "lazygit"

[[install]]
method = "github-release"
repo = "jesseduffield/lazygit"
asset = "lazygit_{version}_darwin_arm64.tar.gz"
format = "tar.gz"
checksums = "checksums.txt"
arch = "arm64"
extract = [
  { file = "lazygit", dest = ".local/bin/lazygit" },
]

[[install]]
method = "github-release"
repo = "jesseduffield/lazygit"
asset = "lazygit_{version}_darwin_x86_64.tar.gz"
format = "tar.gz"
checksums = "checksums.txt"
arch = "amd64"
extract = [
  { file = "lazygit", dest = ".local/bin/lazygit" },
]
