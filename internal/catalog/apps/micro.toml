id = "micro"
name = "Micro"
command = "micro"
optional_paths = [".config/micro/settings.json", ".config/micro/bindings.json", ".config/micro/colorschemes"]
exclude = ["**/backups", "**/backups/**", "**/buffers", "**/buffers/**", "**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
formula = "micro"

[[install]]
method = "github-release"
repo = "micro-editor/micro"
asset = "micro-{version}-macos-arm64.tar.gz"
format = "tar.gz"
checksums = "micro-{version}-macos-arm64.tar.gz.sha"
arch = "arm64"
extract = [
  { file = "micro-{version}/micro", dest = ".local/bin/micro" },
]

[[install]]
method = "github-release"
repo = "micro-editor/micro"
asset = "micro-{version}-osx.tar.gz"
format = "tar.gz"
checksums = "micro-{version}-osx.tar.gz.sha"
arch = "amd64"
extract = [
  { file = "micro-{version}/micro", dest = ".local/bin/micro" },
]
