id = "gemini-cli"
name = "Gemini CLI"
command = "gemini"
optional_paths = [".gemini/settings.json", ".gemini/keybindings.json", ".gemini/GEMINI.md", ".gemini/commands"]
exclude = ["**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]
