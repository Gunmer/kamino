id = "claude-code"
name = "Claude Code"
command = "claude"
optional_paths = [".claude/settings.json", ".claude/keybindings.json", ".claude/CLAUDE.md", ".claude/themes", ".claude/commands", ".claude/agents", ".claude/skills"]
exclude = ["**/.claude.json", "**/projects", "**/projects/**", "**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
cask = "claude-code"

[[install]]
method = "npm"
package = "@anthropic-ai/claude-code"

[[install]]
method = "github-release"
repo = "anthropics/claude-code"
asset = "claude-darwin-arm64.tar.gz"
format = "tar.gz"
checksums = "SHASUMS256.txt"
arch = "arm64"
extract = [
  { file = "claude", dest = ".local/bin/claude" },
]

[[install]]
method = "github-release"
repo = "anthropics/claude-code"
asset = "claude-darwin-x64.tar.gz"
format = "tar.gz"
checksums = "SHASUMS256.txt"
arch = "amd64"
extract = [
  { file = "claude", dest = ".local/bin/claude" },
]
