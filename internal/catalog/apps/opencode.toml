id = "opencode"
name = "OpenCode"
command = "opencode"
optional_paths = [".config/opencode/opencode.json", ".config/opencode/opencode.jsonc", ".config/opencode/cli.json", ".config/opencode/themes", ".config/opencode/commands", ".config/opencode/agents", ".config/opencode/skills"]
exclude = ["**/.env", "**/.env.*", "**/auth.json", "**/.credentials.json", "**/secrets.yaml", "**/secrets.yml", "**/hosts.yml", "**/*.log", "**/logs", "**/logs/**", "**/sessions", "**/sessions/**", "**/history", "**/history/**", "**/*history*", "**/.cache", "**/.cache/**", "**/.git", "**/.git/**"]

[[install]]
method = "brew"
formula = "opencode"

[[install]]
method = "npm"
package = "opencode-ai"

[[install]]
method = "github-release"
repo = "anomalyco/opencode"
asset = "opencode-darwin-arm64.zip"
format = "zip"
arch = "arm64"
extract = [
  { file = "opencode", dest = ".local/bin/opencode" },
]

[[install]]
method = "github-release"
repo = "anomalyco/opencode"
asset = "opencode-darwin-x64.zip"
format = "zip"
arch = "amd64"
extract = [
  { file = "opencode", dest = ".local/bin/opencode" },
]
