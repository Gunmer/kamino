[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kamino-cli"
version = "0.6.0"
description = "Clona y despliega configuraciones de aplicaciones de macOS en un único archivo portable."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cristiam" }]
keywords = ["clone", "deploy", "macos", "dotfiles", "config", "cli"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
]
dependencies = [
  "certifi>=2024.2.2",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "textual>=8.2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "python-semantic-release>=9.12",
]
build = [
  "pyinstaller>=6.10",
]

[project.scripts]
kamino = "kamino.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kamino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["kamino"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/kamino/__init__.py:__version__"]
commit_parser = "conventional"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
build_command = "uv run --no-sync python scripts/build_release.py --update-lock"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix"]
other_allowed_tags = ["build", "chore", "ci", "docs", "perf", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
template_dir = ".github/release-templates"
mode = "update"
insertion_flag = "<!-- version list -->"
