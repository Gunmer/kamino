name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install build deps
        run: uv sync --extra build --dev

      - name: Build binary
        run: |
          uv run pyinstaller \
            --onefile \
            --add-data "src/kamino/catalog/apps:kamino/catalog/apps" \
            --name "kamino-arm64" \
            src/kamino/__main__.py

      - name: Smoke-test embedded catalog
        run: |
          mkdir -p "$RUNNER_TEMP/kamino-home"
          set +e
          HOME="$RUNNER_TEMP/kamino-home" dist/kamino-arm64 backup --dry-run --apps "__packaging_smoke__"
          status=$?
          set -e
          test "$status" -eq 3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamino-arm64
          path: dist/kamino-arm64
          if-no-files-found: error
