name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente cuya publicación se debe completar (vX.Y.Z)"
        required: true
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Obtener main y su historial
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar uv
        uses: astral-sh/setup-uv@v5

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar dependencias bloqueadas
        run: uv sync --locked --all-extras --directory legacy/python

      - name: Versionar, comprobar y publicar
        if: github.event_name == 'workflow_run'
        run: |
          python scripts/release.py --sha "$RELEASE_SHA"

      - name: Completar publicación de un tag existente
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/release.py --tag "$RELEASE_TAG"
